<!doctype html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
        
        <!-- Add Font Awesome for icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        
        <!-- Add configuration and reset function -->
        <script>
            // Configuration variables for model size
            const DEFAULT_SCALE = 0.00973657784901797;
            const MIN_SCALE_FACTOR = 0.5;  // 50% of default size
            const MAX_SCALE_FACTOR = 4.0;  // 400% of default size
            
            // Calculate actual min and max scale values
            const MIN_SCALE = DEFAULT_SCALE * MIN_SCALE_FACTOR;
            const MAX_SCALE = DEFAULT_SCALE * MAX_SCALE_FACTOR;
            
            // Add reset function
            function resetModel() {
                const model = document.getElementById('bowser-model');
                model.setAttribute('scale', `${DEFAULT_SCALE} ${DEFAULT_SCALE} ${DEFAULT_SCALE}`);
                model.setAttribute('rotation', '0 0 0');
            }
        </script>
        
        <style>
            .button-container {
                position: fixed;
                top: 10px;
                right: 10px;
                z-index: 999;
            }
            
            .ui-button {
                background-color: #9fd8cb;
                color: rgb(0, 0, 0);
                border: none;
                border-radius: 5px;
                padding: 10px 20px;
                font-size: 16px;
                cursor: pointer;
                box-shadow: 0 2px 5px rgba(0,0,0,0.3);
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .ui-button:hover {
                background-color: #45a049;
            }
            
            .ui-button i {
                margin-right: 5px;
            }
        </style>
    </head>

    <body style="margin: 0; overflow: hidden;" onload="setScaleLimits()">
        <!-- Reset Button -->
        <div class="button-container">
            <button class="ui-button" onclick="resetModel()">
                <i class="fas fa-sync-alt"></i> Reset
            </button>
        </div>
        
        <script>
            // Set the scale limits for the gesture handler when the page loads
            function setScaleLimits() {
                const model = document.getElementById('bowser-model');
                if (model) {
                    const gestureHandler = model.getAttribute('gesture-handler');
                    const updatedHandler = `enabled: true; rotationFactor: 1; minScale: ${MIN_SCALE}; maxScale: ${MAX_SCALE}; scaleEnabled: true`;
                    model.setAttribute('gesture-handler', updatedHandler);
                }
            }
        </script>
        
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <a-assets>
                <a-asset-item
                    id="animated-asset"
                    src="assets/asset.glb"
                ></a-asset-item>
            </a-assets>

            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
                id="markerA"
            >
                <a-entity
                    id="bowser-model"
                    scale="0.00973657784901797 0.00973657784901797 0.00973657784901797"
                    animation-mixer="loop: repeat"
                    gltf-model="#animated-asset"
                    class="clickable"
                    gesture-handler="enabled: true; rotationFactor: 1; minScale: 0.00486828892450899; maxScale: 0.03894631139607188; scaleEnabled: true"
                ></a-entity>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>

<!doctype html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
        
        <!-- Add Font Awesome for icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        
        <!-- Add fullscreen script -->
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                document.documentElement.requestFullscreen();
            });
            
            // Add reset function
            function resetModel() {
                const model = document.getElementById('bowser-model');
                model.setAttribute('scale', '1 1 1');
                model.setAttribute('rotation', '0 0 0');
            }
        </script>
        
        <style>
            .button-container {
                position: fixed;
                top: 10px;
                left: 10px;
                z-index: 999;
                display: flex;
                gap: 10px;
            }
            
            .ui-button {
                background-color: #9fd8cb;
                color: rgb(0, 0, 0);
                border: none;
                border-radius: 5px;
                padding: 10px 20px;
                font-size: 16px;
                cursor: pointer;
                box-shadow: 0 2px 5px rgba(0,0,0,0.3);
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .ui-button:hover {
                background-color: #45a049;
            }
            
            .ui-button i {
                margin-right: 5px;
            }
        </style>
    </head>
    <body style="margin: 0; overflow: hidden;">
        <!-- Persistent Buttons -->
        <div class="button-container">
            <button class="ui-button" onclick="window.location.href='https://holobites.netlify.app/'">
                <i class="fas fa-arrow-left"></i> Back
            </button>
            <button class="ui-button" onclick="resetModel()">
                <i class="fas fa-sync-alt"></i> Reset
            </button>
        </div>
        
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <a-assets>
                <a-asset-item
                    id="animated-asset"
                    src="assets/asset.glb"
                ></a-asset-item>
            </a-assets>
            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
                id="markerA"
            >
                <a-entity
                    id="bowser-model"
                    scale="1 1 1"
                    animation-mixer="loop: repeat"
                    gltf-model="#animated-asset"
                    class="clickable"
                    gesture-handler="enabled: true; rotationFactor: 1; minScale: 0.5; maxScale: 4; scaleEnabled: true"
                ></a-entity>
            </a-marker>
            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
